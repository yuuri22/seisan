<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>割り勘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Kyash Design System tokens ─────────────────────────── */
:root{
  --blue-50:#EAF4FF;--blue-100:#D2E7FF;--blue-300:#6FB0FF;--blue-500:#0091FF;--blue-600:#0072E5;--blue-700:#0059C2;
  --navy-900:#0B1430;--navy-800:#131E44;--navy-700:#1E2C5E;
  --cyan-400:#36D9F5;--cyan-500:#00C2E8;
  --ink-900:#0E1320;--ink-700:#3A4254;--ink-500:#6B7488;--ink-400:#98A0B3;--ink-300:#C4CAD6;
  --gray-100:#EEF1F6;--gray-50:#F5F7FA;--white:#fff;
  --success-500:#00B876;--success-50:#E2F7EF;
  --warning-500:#FF9500;--warning-50:#FFF2E0;--warning-ink:#9a5a00;
  --danger-500:#FF4D5E;--danger-50:#FFE9EB;--danger-ink:#c0303f;
  --brand:var(--blue-500);--brand-strong:var(--blue-600);--brand-soft:var(--blue-50);
  --text-primary:var(--ink-900);--text-secondary:var(--ink-500);--text-tertiary:var(--ink-400);
  --surface-app:var(--gray-50);--surface-card:var(--white);--surface-sunken:var(--gray-100);
  --border-subtle:var(--gray-100);--border-default:#E2E6EE;
  --money-out:var(--ink-900);
  --gradient-card:linear-gradient(135deg,#1E5BFF 0%,#0091FF 48%,#00C2E8 100%);
  --font-sans:"Plus Jakarta Sans","Noto Sans JP","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,sans-serif;
  --ls-tight:-0.02em;--ls-wide:.04em;--lh-normal:1.5;
  --num:"tnum" 1,"lnum" 1;
  --screen-pad:20px;
  --radius-sm:10px;--radius-md:14px;--radius-lg:18px;--radius-xl:24px;--radius-pill:999px;
  --shadow-sm:0 2px 8px rgba(14,19,32,.06);
  --shadow-md:0 6px 20px rgba(14,19,32,.08);
  --shadow-card:0 10px 30px rgba(0,90,194,.18);
  --shadow-focus:0 0 0 4px rgba(0,145,255,.22);
  --dur-fast:140ms;--dur-base:220ms;--dur-slow:360ms;
  --ease-standard:cubic-bezier(.2,0,0,1);--ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;padding:0 0 calc(70px + env(safe-area-inset-bottom,0px));
  background:var(--surface-app);color:var(--text-primary);
  font-family:var(--font-sans);font-size:16px;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
:focus{outline:none}
:focus-visible{box-shadow:var(--shadow-focus);border-radius:var(--radius-sm)}
.num{font-feature-settings:var(--num)}
.wrap{max-width:520px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}

/* ── primitives ─────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:52px;padding:0 24px;font-size:16px;font-weight:700;letter-spacing:-.01em;
  border:none;border-radius:var(--radius-pill);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-standard),filter var(--dur-fast);
}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none!important}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 18px;font-size:14px}
.btn.lg{height:58px;font-size:17px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(0,114,229,.28)}
.btn-secondary{background:var(--brand-soft);color:var(--brand-strong)}
.btn-quiet{background:var(--surface-sunken);color:var(--text-secondary)}
.btn-danger{background:var(--danger-500);color:#fff}
.btn-ghost{background:transparent;color:var(--brand-strong);padding:0;height:auto}

.field{display:block;margin-bottom:0}
/* field() を通さずに置くラベルもあるため、直接の子に限定しない。
   限定していたころは「立て替えた人」「支払手段」に何も当たらず、
   本文と同じ大きさの素の文字になっていました */
.label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.control{
  display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;background:#fff;
  border:1.5px solid var(--border-default);border-radius:var(--radius-md);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
}
.control:focus-within{border-color:var(--brand);box-shadow:var(--shadow-focus)}
.control .prefix{color:var(--text-secondary);font-weight:700}
.control input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:var(--text-primary)}
.control input:focus-visible{box-shadow:none}
/* 伏字の切り替えボタン。入力欄の右端に置く */
.control .peek{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;margin-right:-6px;padding:0;
  border:none;background:transparent;color:var(--text-tertiary);
  border-radius:50%;cursor:pointer;
  transition:color var(--dur-fast),background var(--dur-fast);
}
.control .peek:hover{color:var(--text-secondary);background:var(--surface-sunken)}
.control .peek[aria-pressed="true"]{color:var(--brand)}
.hint{display:block;font-size:12px;color:var(--text-tertiary);margin-top:6px;line-height:var(--lh-normal)}
textarea.ta{
  width:100%;padding:16px;resize:vertical;background:#fff;border:1.5px solid var(--border-default);
  border-radius:var(--radius-md);font-size:13px;line-height:1.6;color:var(--text-primary);outline:none;
}
textarea.ta:focus{border-color:var(--brand);box-shadow:var(--shadow-focus)}
.drop{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;text-align:center;
  background:#fff;border:1.5px dashed var(--border-default);border-radius:var(--radius-lg);cursor:pointer;
  transition:border-color var(--dur-fast),background var(--dur-fast);
}
.drop:hover{border-color:var(--blue-300)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .dicon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;
  border-radius:50%;background:var(--brand-soft);color:var(--brand);margin-bottom:2px}
.drop .dmain{font-size:15px;font-weight:700;color:var(--brand-strong)}
.drop .dsub{font-size:13px;color:var(--text-tertiary);line-height:var(--lh-normal)}
.filename{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius-md);
  background:var(--brand-soft);color:var(--brand-strong);font-size:13px;font-weight:600}
.toggle-link{border:none;background:transparent;color:var(--text-link,var(--blue-600));
  font-size:13px;font-weight:600;cursor:pointer;padding:6px 2px}

.seg{display:flex;padding:4px;gap:4px;background:var(--surface-sunken);border-radius:var(--radius-pill)}
.seg button{
  flex:1;height:40px;border:none;cursor:pointer;font-size:14px;font-weight:700;
  border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);
  transition:all var(--dur-fast) var(--ease-standard);
}
.seg button.on{background:#fff;color:var(--brand-strong);box-shadow:var(--shadow-sm)}

/* 月の絞り込み。月が何年ぶん増えても高さが変わらないよう、
   横に並べるのではなくセレクトで受けます */
/* 幅は中身に合わせます。セレクトは一番長い選択肢の幅になるので、
   どの月を選んでも幅は変わりません */
.monthpick{position:relative;display:inline-block;max-width:100%}
.monthpick select{
  width:auto;min-width:132px;max-width:100%;height:40px;padding:0 38px 0 13px;border-radius:var(--radius-md);
  border:1.5px solid var(--border-default);background:var(--surface-card);
  color:var(--text-primary);font-family:inherit;font-size:14px;font-weight:700;
  -webkit-appearance:none;appearance:none;cursor:pointer;
  transition:all var(--dur-fast) var(--ease-standard);
}
.monthpick select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.monthpick .chev{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  display:inline-flex;color:var(--text-tertiary);pointer-events:none;
}
/* 絞り込み中は、ひと目で分かるように色を変えます */
.monthpick.on select{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}
.monthpick.on .chev{color:var(--brand)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;font-size:14px;font-weight:600;
  border:1.5px solid var(--border-default);background:#fff;color:var(--text-secondary);
  border-radius:var(--radius-pill);cursor:pointer;transition:all var(--dur-fast) var(--ease-standard);
}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}

.card{background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:16px}
.card.md{box-shadow:var(--shadow-md)}

/* フォームの中の小区画。
   編集のときはカードの中に入るため、影では輪郭が出ない。
   輪郭も引かず、面の色だけで区切る。

   青系は「選択中」を表す色として既に使っているため、
   地（#F5F7FA と白）から離れた暖色の淡い面を使う。
   どちらの地の上でも面として認識できる。 */
.inset{
  background:var(--warning-50);
  border-radius:var(--radius-lg);
  padding:16px;
}
.inset > .ttl{
  display:block;font-size:14px;font-weight:700;
  color:var(--text-primary);margin-bottom:4px;
}
/* 淡い暖色の上では、既定の文字色（#6B7488）は比 4.25 で
   基準の 4.5 に届かない。この区画の中だけ1段濃くする */
.inset .label,.inset .muted{color:var(--ink-700)}
.cat{
  width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);
}
.cat.sm{width:36px;height:36px}
.badge{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;font-size:12px;font-weight:700;
  border-radius:var(--radius-pill);background:var(--surface-sunken);color:var(--ink-700);
}
h2.sect{font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}

/* ── layout ─────────────────────────────────────────────── */
header.bar{display:flex;align-items:center;justify-content:space-between;padding:16px var(--screen-pad) 8px}
.appname{font-size:20px;font-weight:800;letter-spacing:var(--ls-tight)}
.status{font-size:12px;font-weight:600;color:var(--text-tertiary)}
.hero{padding:8px var(--screen-pad) 0}
.gradcard{
  background:var(--gradient-card);box-shadow:var(--shadow-card);border-radius:var(--radius-xl);
  padding:22px 22px 20px;color:#fff;
}
.overline{font-size:12px;font-weight:700;letter-spacing:var(--ls-wide);color:rgba(255,255,255,.78)}
.dir{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.amount{font-weight:800;letter-spacing:var(--ls-tight);line-height:1.05}
.amount .yen{font-size:.55em;vertical-align:.12em;margin-right:1px}
.meter{margin-top:20px}
.track{position:relative;height:6px;border-radius:var(--radius-pill);background:rgba(255,255,255,.25)}
.track .mid{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:rgba(255,255,255,.45)}
.track .knob{
  position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(11,20,48,.28);transition:left var(--dur-slow) var(--ease-out);
}
.meter .ends{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;font-weight:600;color:rgba(255,255,255,.8)}

.notices{padding:0 var(--screen-pad)}
.notice{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:var(--radius-lg)}
.notice.info{background:var(--brand-soft);color:var(--brand-strong)}
.notice.warn{background:var(--warning-50);color:var(--warning-ink)}
.notice.err{background:var(--danger-50);color:var(--danger-ink)}
.notice .txt{flex:1;font-size:13px;font-weight:600;line-height:var(--lh-normal)}
.notice .link{border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:inherit;padding:4px}
main{padding:24px var(--screen-pad) 0}
.stack{display:grid;gap:16px}
.stack.lg{gap:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.entry{display:flex;align-items:center;gap:12px}
.entry .body{flex:1;min-width:0}
.entry .title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .sub{
  display:flex;gap:6px;margin-top:3px;font-size:13px;color:var(--text-tertiary);
  white-space:nowrap;                      /* 日付も立替も折り返さない */
}
/* 日付は「1月1日」〜「12月31日」で幅がほぼ一定。
   最大幅ぶんを先に確保して、カードをまたいで縦に揃える */
.entry .sub .date{flex:none;min-width:4.6em}
.entry .right{text-align:right;flex:none}
.entry .amt{font-size:15px;font-weight:700;color:var(--money-out)}
.entry .bal{font-size:12px;font-weight:600;margin-top:3px;color:var(--brand-strong)}
.personal{margin-top:10px;padding:8px 12px;border-radius:var(--radius-md);background:var(--warning-50);
  font-size:12px;font-weight:600;color:var(--warning-ink);line-height:var(--lh-normal)}
.acts{display:flex;gap:16px;margin-top:8px;padding-top:6px;border-top:1px solid var(--border-subtle)}
.acts button{display:inline-flex;align-items:center;gap:5px;border:none;background:transparent;
  padding:8px 4px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-sm)}
.acts .spacer{flex:1}
.acts .danger{color:var(--danger-500)}
.acts .brand{color:var(--brand-strong)}
.settled{opacity:.62}

.preview{background:var(--surface-sunken);border-radius:var(--radius-lg);padding:14px 16px}
.preview .line{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:14px}
.preview .line span:first-child{color:var(--text-secondary)}
.preview .line b{font-size:15px;font-weight:600}
.preview .total{border-top:1px solid var(--border-default);margin-top:6px;padding-top:8px;font-weight:700}
.err{margin:0;font-size:14px;font-weight:600;color:var(--danger-500)}

/* 誰が何で立て替えたか。ふたりを列にして、横に読めば比べられる形にします。
   縦に6行並べていたときは、同じ手段どうしを見比べるのに
   上下へ目を動かす必要がありました */
.xtab{width:100%;border-collapse:collapse;table-layout:fixed}
.xtab th,.xtab td{padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.xtab col.who{width:31%}
.xtab thead th{
  padding:0 0 8px;font-size:12px;font-weight:700;color:var(--text-tertiary);
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:none;
}
.xtab tbody th{text-align:left;font-weight:600}
.xtab tbody th .mth{display:flex;align-items:center;gap:10px;font-size:14px}
.xtab td{
  text-align:right;font-size:15px;font-weight:700;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
.xtab td.zero{color:var(--text-tertiary);font-weight:600}
.xtab tbody tr:last-child th,.xtab tbody tr:last-child td{border-bottom:none}
.xtab tfoot th,.xtab tfoot td{
  border-top:1.5px solid var(--border-default);border-bottom:none;padding-top:11px;
  font-size:13px;color:var(--text-secondary);
}
.xtab tfoot td{font-size:15px;color:var(--text-primary)}

.list{padding:4px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border-subtle);cursor:pointer}
.list .item:last-child{border-bottom:none}
.list .item.off{opacity:.5}
.list .item input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:none}
.list .item .t{flex:1;min-width:0}
.list .item .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .item .t small{display:block;font-size:12px;color:var(--text-tertiary);margin-top:2px}

.empty{text-align:center;padding:40px 8px 24px}
.empty .icon{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;
  border-radius:50%;background:var(--brand-soft);color:var(--brand);margin-bottom:18px}
.empty h3{font-size:17px;font-weight:700;margin:0 0 6px}
.empty p{font-size:14px;color:var(--text-secondary);line-height:var(--lh-normal);margin:0 0 20px}
.muted{font-size:13px;color:var(--text-tertiary);line-height:var(--lh-normal)}

/* スイッチ */
.sw{width:52px;height:32px;flex:none;padding:3px;border:none;border-radius:var(--radius-pill);
  background:var(--ink-300);cursor:pointer;display:flex;align-items:center;
  transition:background var(--dur-base) var(--ease-standard)}
.sw.on{background:var(--brand)}
.sw .knob{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);
  transform:translateX(0);transition:transform var(--dur-base) var(--ease-spring)}
.sw.on .knob{transform:translateX(20px)}

/* 使い方ページ */
.guide{padding-bottom:8px}
.guide .lead{font-size:14px;color:var(--text-secondary);line-height:var(--lh-normal);margin:0 0 4px}
.guide h3{font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.guide p{font-size:14px;color:var(--text-secondary);line-height:1.7;margin:0 0 10px}
.guide p:last-child{margin-bottom:0}
.guide b{color:var(--text-primary);font-weight:700}
.guide ol,.guide ul{margin:0 0 10px;padding-left:1.3em;font-size:14px;color:var(--text-secondary);line-height:1.8}
.guide li{margin-bottom:4px}
.guide li:last-child{margin-bottom:0}
.guide .note{
  padding:12px 14px;border-radius:var(--radius-md);background:var(--surface-sunken);
  font-size:13px;line-height:1.7;color:var(--text-secondary);
}
.guide .note.warn{background:var(--warning-50);color:var(--warning-ink)}
.guide .note.info{background:var(--brand-soft);color:var(--brand-strong)}
.guide .kv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
.guide .kv:last-child{border-bottom:none}
.guide .kv .k{flex:none;width:96px;font-weight:700;color:var(--text-primary)}
.guide .kv .v{flex:1;color:var(--text-secondary);line-height:1.6}
.guide .flow{display:grid;gap:8px}
.guide .step{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text-secondary);line-height:1.6}
.guide .step .dot{
  flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;
  background:var(--brand-soft);color:var(--brand-strong);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
}
.guide .calc{
  font-size:13px;line-height:1.9;background:var(--surface-sunken);border-radius:var(--radius-md);padding:12px 14px;
}
.guide .calc .row{display:flex;justify-content:space-between;gap:12px}
.guide .calc .row.total{border-top:1px solid var(--border-default);margin-top:6px;padding-top:6px;font-weight:700;color:var(--text-primary)}

nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--border-subtle);padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabbar .inner{display:flex;width:100%;max-width:520px;padding:0 var(--screen-pad)}
nav.tabbar button{
  flex:1;min-width:0;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:8px 0 7px;
  color:var(--text-tertiary);font-size:10.5px;font-weight:700;line-height:1;letter-spacing:-.02em;
  border-radius:var(--radius-md);transition:color var(--dur-fast);
}
nav.tabbar button .ico{display:inline-flex;height:22px}
nav.tabbar button.on{color:var(--brand)}

/* ── 狭い画面での収まり ─────────────────────────────────
   グリッドの子は既定で「中身より小さくなれない」ため、
   入力欄の最小幅（約170px）が効いて2カラムが416px必要になり、
   スマホの表示領域（335〜390px）からはみ出していました。
   縮んでよいことを明示します。 */
.stack > *,.grid2 > *,.card > *{min-width:0}
.control{max-width:100%}
.control input{width:100%;min-width:0}

/* 日付欄は端末ごとに最小幅を持つため、はみ出す余地を残さない */
.control input[type="date"]{max-width:100%;-webkit-appearance:none;appearance:none}

/* 名前が長いと切り出しボタンが押し出されるのを防ぐ */
.seg{max-width:100%}
.seg button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}

/* 2カラムが窮屈になる幅では、素直に縦へ積む */
@media (max-width:420px){
  .grid2{grid-template-columns:1fr}
}

/* 長い鍵やURLが、横スクロールを生まないように */
.ta{max-width:100%;word-break:break-all}

/* ── 確認ダイアログ ─────────────────────────────────────
   背面を押しても閉じません。
   誤って触れたときに、取り消しにくい操作が
   そのまま進んでしまわないようにするためです。 */
.backdrop{
  position:fixed;inset:0;z-index:60;
  display:grid;place-items:center;padding:20px;
  background:rgba(11,20,48,.52);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  animation:fade var(--dur-base) var(--ease-standard);
}
.dialog{
  width:100%;max-width:360px;background:var(--surface-card);
  border-radius:var(--radius-xl);padding:24px 22px 20px;
  box-shadow:0 24px 60px rgba(11,20,48,.32);
  animation:pop var(--dur-base) var(--ease-out);
}
.dialog h3{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:var(--ls-tight)}
.dialog p{margin:0;font-size:14px;line-height:1.7;color:var(--text-secondary)}
.dialog .amount{
  display:block;margin:16px 0 4px;padding:14px;border-radius:var(--radius-md);
  background:var(--surface-sunken);text-align:center;
}
.dialog .amount .n{display:block;font-size:26px;font-weight:800;color:var(--text-primary);letter-spacing:var(--ls-tight)}
.dialog .amount .u{display:block;margin-top:2px;font-size:12px;color:var(--text-tertiary)}
/* ボタンを横に並べる行。
   カード下部の「編集・削除」に使う .acts とは別物です。
   同じ名前にすると .acts button の指定が勝ってしまい、
   ボタンの背景が透明になって影だけが残ります。 */
.rowacts{display:flex;gap:10px}
.rowacts > .btn{flex:1;min-width:0;padding:0 14px;box-shadow:none}
.rowacts > .btn-quiet{
  background:var(--surface-card);color:var(--text-primary);
  border:1.5px solid var(--ink-300);
}
.rowacts > .btn-quiet:active{background:var(--surface-sunken)}
.rowacts > .btn-primary{background:var(--brand);color:#fff;border:1.5px solid var(--brand)}
.rowacts > .btn-danger{background:var(--danger-500);color:#fff;border:1.5px solid var(--danger-500)}

/* 編集カードの見出し。閉じるボタンを右上に置き、
   フォームの下までスクロールしなくてもやめられるようにする */
.edithead{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:15px;font-weight:700;
}
.xclose{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;margin:-6px -6px -6px 0;padding:0;
  border:none;background:transparent;color:var(--text-tertiary);
  border-radius:50%;cursor:pointer;
  transition:color var(--dur-fast),background var(--dur-fast);
}
.xclose:hover{color:var(--text-primary);background:var(--surface-sunken)}
.dialog .rowacts{margin-top:20px}
.dialog .rowacts > .btn{height:50px;font-size:15px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.backdrop,.dialog{animation:none}}

<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ─────────────────────────────────────────────────────────
   保存先
   ・Claudeのアーティファクト内 → window.storage
   ・ダウンロードして自分のブラウザで開いた場合 → localStorage
   どちらも使えない場合は、開いている間だけメモリに保持します。
   ───────────────────────────────────────────────────────── */
/* ============================================================
   同期の既定値
   セットアップのときに、ここの3つを書き換えます。
   埋めておくと、アプリを開いた時点で同期が始まります。
   空のままなら、設定画面から手で入れる形になります。
   ============================================================ */
var DEFAULTS = {
  url:   "",   // 例: https://xxxxxxxx.supabase.co
  key:   "",   // anon public キー
  house: ""    // 共有キー（UUID）
};

/* ============================================================
   招待リンクから設定を受け取る

   URLの「#」より後ろは、サーバーに送信されません。
   そのため、GitHubなど公開の場所にアプリを置いたままでも、
   鍵はリンクを受け取った人の端末にしか渡りません。
   ============================================================ */
function readInvite() {
  var hash = String(location.hash || "");
  var m = /[#&]s=([A-Za-z0-9\-_=]+)/.exec(hash);
  if (!m) return null;
  try {
    var json = atob(m[1].replace(/-/g, "+").replace(/_/g, "/"));
    var o = JSON.parse(json);
    if (o && o.u && o.k && o.h) return { url: o.u, key: o.k, house: o.h, on: true };
  } catch (e) {}
  return null;
}

function makeInvite() {
  var payload = JSON.stringify({ u: S.sync.url, k: S.sync.key, h: S.sync.house });
  var code = btoa(payload).replace(/\+/g, "-").replace(/\//g, "_");
  return location.origin + location.pathname + "#s=" + code;
}

/* アドレス欄から鍵を消す。履歴や共有時に残らないように */
function clearInvite() {
  if (!location.hash) return;
  try {
    history.replaceState(null, "", location.pathname + location.search);
  } catch (e) {
    location.hash = "";
  }
}

var KEY = "warikan:data";
var Store = (function () {
  var memory = null;
  var mode = "memory";
  if (typeof window !== "undefined" && window.storage && window.storage.get) {
    mode = "artifact";
  } else {
    try {
      window.localStorage.setItem("warikan:test", "1");
      window.localStorage.removeItem("warikan:test");
      mode = "local";
    } catch (e) { mode = "memory"; }
  }
  return {
    mode: mode,
    load: function () {
      if (mode === "artifact") {
        return window.storage.get(KEY, false).then(function (r) {
          return r && r.value ? JSON.parse(r.value) : null;
        }).catch(function () { return null; });
      }
      try {
        if (mode === "local") {
          var v = window.localStorage.getItem(KEY);
          return Promise.resolve(v ? JSON.parse(v) : null);
        }
      } catch (e) {}
      return Promise.resolve(memory);
    },
    save: function (data) {
      if (mode === "artifact") return window.storage.set(KEY, JSON.stringify(data), false);
      try {
        if (mode === "local") {
          window.localStorage.setItem(KEY, JSON.stringify(data));
          return Promise.resolve();
        }
      } catch (e) { return Promise.reject(e); }
      memory = data;
      return Promise.resolve();
    }
  };
})();

/* ── 状態 ────────────────────────────────────────────────── */
var S = {
  names: { A: "Aさん", B: "Bさん" },
  entries: [],
  book: { lastExportAt: "", pending: 0 },
  sync: { url: "", key: "", house: "", on: false },
  namesUpdatedAt: 0
};
var UI = {
  tab: "home", filter: "未精算", scope: "未精算", month: "",
  editId: null, form: null,
  parsed: null, csvText: "", importPayer: "A", parseError: "",
  fileName: "", showPaste: false, reading: false,
  formError: "", notice: "", saveError: false, saving: false,
  copied: false, copyFallback: "", justSettled: false, bannerOff: -1,
  confirmReset: false, confirm: null, loading: true, reveal: {},
  syncing: false, syncMsg: "", syncErr: "", lastSync: "",
  invited: false, inviteUrl: "", inviteCopyErr: "", pendingInvite: null
};

var METHODS = ["PayPay", "現金", "クレカ"];
var META = {
  "PayPay": { color: "var(--blue-500)", soft: "#EAF4FF", icon: "phone" },
  "現金":   { color: "var(--success-500)", soft: "#E2F7EF", icon: "cash" },
  "クレカ": { color: "var(--warning-500)", soft: "#FFF2E0", icon: "card" }
};
function meta(m) { return META[m] || META["現金"]; }

/* ── 小道具 ──────────────────────────────────────────────── */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function yen(n) {
  return (n < 0 ? "−" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
}
function money(n, size) {
  var neg = n < 0;
  return '<span class="amount num" style="font-size:' + size + 'px">' +
    (neg ? "−" : "") + '<span class="yen">¥</span>' +
    Math.abs(Math.round(n)).toLocaleString("ja-JP") + '</span>';
}
function today() { return new Date().toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function jpDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? Number(m[2]) + "月" + Number(m[3]) + "日" : (s || "");
}

/* 月の絞り込み。日付は "2026-08-15" の形で持っています */
function ymOf(d) { return (d || "").slice(0, 7); }
function ymFull(ym) {
  var m = /^(\d{4})-(\d{2})$/.exec(ym || "");
  return m ? Number(m[1]) + "年" + Number(m[2]) + "月" : "";
}
// ボタンの中は短く。今年なら「8月」、去年以前なら「2025年12月」
function ymLabel(ym) {
  var m = /^(\d{4})-(\d{2})$/.exec(ym || "");
  if (!m) return "";
  return Number(m[1]) === new Date().getFullYear()
    ? Number(m[2]) + "月"
    : Number(m[1]) + "年" + Number(m[2]) + "月";
}
function monthsOf(list) {
  var seen = {}, out = [];
  list.forEach(function (r) {
    var k = ymOf(r.date);
    if (k && !seen[k]) { seen[k] = 1; out.push(k); }
  });
  return out.sort().reverse();
}
// 選んでいた月が今のデータに無いときは「すべての月」として扱います。
// その月の記録を消したあと、空の一覧から抜け出せなくなるのを防ぎます
function curMonth() {
  if (!UI.month) return "";
  return monthsOf(rows()).indexOf(UI.month) >= 0 ? UI.month : "";
}
function inMonth(r, m) { return !m || ymOf(r.date) === m; }
function whenLabel(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* アイコン（2pxラウンドライン） */
var PATHS = {
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  import: '<path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  gear: '<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.46V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.46-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.46V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.46 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 9a1.6 1.6 0 0 0 1.46 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.46 1Z"/>',
  phone: '<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/>',
  cash: '<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v4M18 10v4"/>',
  card: '<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h3"/>',
  pencil: '<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14.5 6.5l3 3"/>',
  trash: '<path d="M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7"/>',
  check: '<path d="M5 12.5 10 17.5 19 7"/>',
  undo: '<path d="M4 9h11a5 5 0 0 1 0 10h-5"/><path d="M8 5 4 9l4 4"/>',
  download: '<path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4.5 18.5h15"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-7A2.5 2.5 0 0 0 3 5.5v7A2.5 2.5 0 0 0 5.5 15"/>',
  arrow: '<path d="M4 12h15m0 0-5-5m5 5-5 5"/>',
  chevDown: '<path d="M6 9.5 12 15.5 18 9.5"/>',
  sync: '<path d="M20 11.5A8 8 0 0 0 6.3 6.3L4 8.5"/><path d="M4 4.5V9h4.5"/><path d="M4 12.5a8 8 0 0 0 13.7 5.2L20 15.5"/><path d="M20 19.5V15h-4.5"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  eye: '<path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M9.9 5.7A10.6 10.6 0 0 1 12 5.5c6.2 0 10 6.5 10 6.5a18.6 18.6 0 0 1-3.2 4"/><path d="M6.4 7.9A18.4 18.4 0 0 0 2 12s3.8 6.5 10 6.5a10.8 10.8 0 0 0 3.4-.55"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/>',
  book: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H18a2 2 0 0 1 2 2v13.5"/><path d="M4 4.5v13A2.5 2.5 0 0 0 6.5 20H20"/><path d="M8 8h8M8 12h6"/>'
};
function icon(name, size, stroke) {
  size = size || 24;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="' + (stroke || 2) + '" stroke-linecap="round" stroke-linejoin="round">' +
    (PATHS[name] || "") + '</svg>';
}

/* ── 計算：総額から個人分を引いて折半する ─────────────────── */
function calc(e) {
  var amount = Number(e.amount) || 0;
  var ap = Number(e.aPersonal) || 0;
  var bp = Number(e.bPersonal) || 0;
  var common = Math.max(0, amount - ap - bp);
  var half = Math.round(common / 2);
  var aOwe = half + ap;
  var bOwe = common - half + bp;
  return {
    amount: amount, common: common, aOwe: aOwe, bOwe: bOwe,
    balance: e.payer === "A" ? bOwe : -aOwe   // プラス = B が A に払う
  };
}
function rows() {
  return S.entries.map(function (e) {
    var c = calc(e);
    return Object.assign({}, e, c);
  });
}

/* ── PayPay CSV ──────────────────────────────────────────── */
function splitLine(line) {
  var out = [], cur = "", q = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') {
      if (q && line[i + 1] === '"') { cur += '"'; i++; } else { q = !q; }
    } else if (c === "," && !q) { out.push(cur); cur = ""; } else { cur += c; }
  }
  out.push(cur);
  return out.map(function (s) { return s.trim(); });
}
function toNum(s) {
  var n = Number(String(s || "").replace(/[¥,円\s]/g, ""));
  return isFinite(n) ? n : 0;
}
var SKIP = ["送金", "チャージ", "受け取", "ポイント", "出金", "返金", "キャンセル"];
function parsePayPay(text) {
  var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ""; });
  if (!lines.length) return { rows: [], error: "貼り付けられたデータが空です。" };
  var headIdx = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("取引日") >= 0 || lines[i].indexOf("出金") >= 0) { headIdx = i; break; }
  }
  if (headIdx < 0) headIdx = 0;
  var head = splitLine(lines[headIdx]);
  function find() {
    var keys = Array.prototype.slice.call(arguments);
    for (var j = 0; j < head.length; j++) {
      for (var k = 0; k < keys.length; k++) if (head[j].indexOf(keys[k]) >= 0) return j;
    }
    return -1;
  }
  var iDate = find("取引日", "日付"), iOut = find("出金"),
      iKind = find("取引内容"), iShop = find("取引先"), iTxn = find("取引番号");
  if (iDate < 0 || iOut < 0) {
    return { rows: [], error: "列が読み取れません。PayPayの取引履歴CSVを、見出し行ごと貼り付けてください。" };
  }
  var out = [];
  for (var r = headIdx + 1; r < lines.length; r++) {
    var c = splitLine(lines[r]);
    if (c.length < 2 || !c[iDate]) continue;
    var amount = toNum(c[iOut]);
    var kind = iKind >= 0 ? c[iKind] : "";
    var shop = iShop >= 0 ? c[iShop] : "";
    var hit = SKIP.filter(function (s) { return kind.indexOf(s) >= 0 || shop.indexOf(s) >= 0; })[0];
    out.push({
      key: uid(),
      date: String(c[iDate]).replace(/\//g, "-").slice(0, 10),
      title: shop || kind || "（店名なし）",
      amount: amount,
      txnId: iTxn >= 0 ? c[iTxn] : "",
      include: amount > 0 && !hit,
      reason: amount <= 0 ? "支出ではありません" : (hit ? "送金・チャージ等" : "")
    });
  }
  if (!out.length) return { rows: [], error: "取り込める行が見つかりませんでした。" };
  return { rows: out, error: "" };
}


/* ─────────────────────────────────────────────────────────
   ふたりで同期する（Supabase）

   ・端末側の記録が主で、同期は追いつくための仕組みです。
     設定していなくても、繋がらなくても、アプリは通常どおり動きます。
   ・同じ記録が両方で編集された場合は、あとから直したほうを残します。
   ・削除は消さずに印を付けて送ります。そうしないと、
     相手の端末から古い記録が復活してしまうためです。
   ───────────────────────────────────────────────────────── */
function syncReady() {
  return !!(S.sync.on && S.sync.url && S.sync.key && S.sync.house);
}

function stampEntry(e) {
  return Object.assign({}, e, { updatedAt: e.updatedAt || Date.now() });
}

/* 端末の記録を、送信用の形に直す */
function toRemote(e) {
  return {
    id: e.id, date: e.date, title: e.title, amount: e.amount, payer: e.payer,
    method: e.method || "", a_personal: e.aPersonal || 0, a_personal_note: e.aPersonalNote || "",
    b_personal: e.bPersonal || 0, b_personal_note: e.bPersonalNote || "",
    txn_id: e.txnId || "", settled: !!e.settled, settled_on: e.settledOn || "",
    source: e.source || "manual", deleted: !!e.deleted,
    updated_at: new Date(e.updatedAt || Date.now()).toISOString()
  };
}

/* 受け取った形を、端末の記録に直す */
function fromRemote(r) {
  return {
    id: r.id, date: r.date, title: r.title, amount: r.amount, payer: r.payer,
    method: r.method || "", aPersonal: r.a_personal || 0, aPersonalNote: r.a_personal_note || "",
    bPersonal: r.b_personal || 0, bPersonalNote: r.b_personal_note || "",
    txnId: r.txn_id || "", settled: !!r.settled, settledOn: r.settled_on || "",
    source: r.source || "manual", deleted: !!r.deleted,
    updatedAt: new Date(r.updated_at).getTime()
  };
}

function callSync(fn, body) {
  var base = String(S.sync.url).replace(/\/+$/, "");
  return fetch(base + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": S.sync.key,
      "Authorization": "Bearer " + S.sync.key
    },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (t) {
        var lower = String(t || "").toLowerCase();
        throw new Error(
          lower.indexOf("unknown key") >= 0
            ? "共有キーが違うようです。SQLの実行結果に出た値と見比べてください。"
          : lower.indexOf("too many") >= 0
            ? "記録が多すぎて送れませんでした。古い記録を整理してください。"
          : res.status === 404
            ? "設定を実行できていないようです。SQLの貼り付けが済んでいるかご確認ください。"
          : res.status === 401 || res.status === 403
            ? "APIキーが違うようです。anon public のキーをご確認ください。"
            : "同期できませんでした（" + res.status + "）");
      });
    }
    return res.json();
  });
}

/* 端末と相手の記録を突き合わせる。あとから直したほうを残す */
function merge(remote) {
  var byId = {};
  S.entries.forEach(function (e) { byId[e.id] = stampEntry(e); });

  (remote.entries || []).forEach(function (r) {
    var incoming = fromRemote(r);
    var mine = byId[incoming.id];
    if (!mine || incoming.updatedAt > mine.updatedAt) byId[incoming.id] = incoming;
  });

  S.entries = Object.keys(byId).map(function (k) { return byId[k]; })
    .filter(function (e) { return !e.deleted; })
    .sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });

  // 表示名は、あとから変えたほうを採用する
  var remoteAt = remote.namesUpdatedAt ? new Date(remote.namesUpdatedAt).getTime() : 0;
  if (remote.names && remoteAt > (S.namesUpdatedAt || 0)) {
    S.names = { A: remote.names.A, B: remote.names.B };
    S.namesUpdatedAt = remoteAt;
  }
}

var syncTimer = null;
function scheduleSync() {
  if (!syncReady()) return;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { runSync(true); }, 1200);
}

function runSync(quiet) {
  if (!syncReady()) return Promise.resolve();
  UI.syncing = true; UI.syncErr = "";
  if (!quiet) render(); else paintStatus();

  // 削除済みも含めて送る（相手の端末から復活させないため）
  var payload = S.entries.concat(S.trash || []).map(function (e) { return toRemote(stampEntry(e)); });

  return callSync("warikan_push", {
    p_key: S.sync.house,
    p_entries: payload,
    p_name_a: S.names.A,
    p_name_b: S.names.B,
    p_names_updated: new Date(S.namesUpdatedAt || Date.now()).toISOString()
  }).then(function (data) {
    merge(data || {});
    S.trash = [];
    UI.syncing = false;
    UI.lastSync = whenLabel(new Date().toISOString());
    UI.syncErr = "";
    persistOnly();
    render();
  }).catch(function (err) {
    UI.syncing = false;
    UI.syncErr = err && err.message ? err.message : "同期できませんでした。";
    render();
  });
}

/* ── 保存 ────────────────────────────────────────────────── */
function persistOnly() {
  UI.saving = true;
  paintStatus();
  return Store.save({
    names: S.names, entries: S.entries, book: S.book,
    sync: S.sync, namesUpdatedAt: S.namesUpdatedAt, trash: S.trash || []
  }).then(function () {
    UI.saving = false; UI.saveError = false; paintStatus();
  }).catch(function () {
    UI.saving = false; UI.saveError = true; render();
  });
}
function persist() {
  persistOnly();
  scheduleSync();
}
function change(fn) {
  fn();
  S.book.pending = S.book.pending + 1;
  persist();
  render();
}

/* ── 表データ（CSVとコピーで共用） ───────────────────────── */
function sheetHeader() {
  return ["日付", "内容", "金額", "払った人", "支払手段",
    S.names.A + "の個人分", "中身", S.names.B + "の個人分", "中身",
    "共通分", S.names.A + "の負担", S.names.B + "の負担", "貸し借り(＋=B→A)",
    "精算済み", "精算日", "取引番号"];
}
function sheetRows() {
  return rows().map(function (r) {
    return [r.date, r.title, r.amount, r.payer === "A" ? S.names.A : S.names.B, r.method || "",
      r.aPersonal || 0, r.aPersonalNote || "", r.bPersonal || 0, r.bPersonalNote || "",
      r.common, r.aOwe, r.bOwe, r.balance,
      r.settled ? "済" : "", r.settledOn || "", r.txnId || ""];
  });
}
function table() { return [sheetHeader()].concat(sheetRows()); }

function markExported() {
  S.book = { lastExportAt: new Date().toISOString(), pending: 0 };
  UI.justSettled = false;
  persist();
}
function exportCsv() {
  var csv = table().map(function (line) {
    return line.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  var url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  var a = document.createElement("a");
  a.href = url; a.download = "warikan-" + today() + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  markExported();
  render();
}
function copyForSheet() {
  var tsv = table().map(function (line) {
    return line.map(function (c) { return String(c).replace(/[\t\n\r]/g, " "); }).join("\t");
  }).join("\n");
  function ok() {
    UI.copied = true; UI.copyFallback = "";
    markExported(); render();
    setTimeout(function () { UI.copied = false; render(); }, 2600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tsv).then(ok).catch(function () {
      UI.copyFallback = tsv; UI.tab = "set"; render();
    });
  } else {
    UI.copyFallback = tsv; UI.tab = "set"; render();
  }
}

// 招待リンクは長いので、指でなぞって選ぶと途中で切れがちです。
// 自動コピーが使えない環境では、枠の中を全選択した状態にして返します
function copyInvite() {
  if (!UI.inviteUrl) return;
  function ok() {
    UI.invited = true; UI.inviteCopyErr = ""; render();
    setTimeout(function () { UI.invited = false; render(); }, 2600);
  }
  function manual() {
    UI.invited = false;
    UI.inviteCopyErr = "この端末では自動コピーが使えませんでした。枠の中を選んだ状態にしたので、そのままコピーしてください。";
    render();
    var box = document.getElementById("invitebox");
    if (box) { box.focus(); box.select(); try { box.setSelectionRange(0, box.value.length); } catch (e) {} }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(UI.inviteUrl).then(ok).catch(manual);
  } else { manual(); }
}

function toForm(e) {
  return { date: e.date, title: e.title, amount: String(e.amount), payer: e.payer, method: e.method || "現金",
    aPersonal: e.aPersonal ? String(e.aPersonal) : "", aPersonalNote: e.aPersonalNote || "",
    bPersonal: e.bPersonal ? String(e.bPersonal) : "", bPersonalNote: e.bPersonalNote || "" };

function validate(f) {
  if (!f.title.trim()) return "何に使ったかを入れてください。";
  var amount = Number(f.amount);
  if (!amount || amount <= 0) return "金額を入れてください。";
  var ap = Number(f.aPersonal) || 0, bp = Number(f.bPersonal) || 0;
  if (ap < 0 || bp < 0) return "個人分にマイナスは入れられません。";
  if (ap + bp > amount) return "個人分の合計が金額を超えています。";
  return "";
}
function fromForm(f) {
  return { date: f.date, title: f.title.trim(), amount: Number(f.amount), payer: f.payer, method: f.method,
    aPersonal: Number(f.aPersonal) || 0, aPersonalNote: f.aPersonalNote.trim(),
    bPersonal: Number(f.bPersonal) || 0, bPersonalNote: f.bPersonalNote.trim() };
}

/* ── CSVファイルの読み込み ─────────────────────────────────
   PayPayのCSVは Shift_JIS で出力されることが多いため、
   UTF-8 で読んで文字化けが出たら読み直します。
   ───────────────────────────────────────────────────────── */
function readCsvFile(file) {
  if (!file) return;
  UI.reading = true; UI.parseError = ""; render();

  function done(text) {
    UI.reading = false;
    UI.fileName = file.name;
    UI.csvText = text;
    var res = parsePayPay(text);
    UI.parseError = res.error;
    UI.parsed = res.error ? null : res.rows;
    render();
  }
  function fail(msg) {
    UI.reading = false; UI.parsed = null;
    UI.parseError = msg;
    render();
  }

  var r1 = new FileReader();
  r1.onload = function () {
    var text = String(r1.result || "");
    // 置換文字が混ざっていたら Shift_JIS として読み直す
    if (text.indexOf("\uFFFD") >= 0) {
      var r2 = new FileReader();
      r2.onload = function () { done(String(r2.result || "")); };
      r2.onerror = function () { done(text); };
      try { r2.readAsText(file, "Shift_JIS"); } catch (e) { done(text); }
      return;
    }
    done(text);
  };
  r1.onerror = function () { fail("ファイルを読み込めませんでした。もう一度お試しください。"); };
  r1.readAsText(file, "UTF-8");
}

      ? "ほかの月の未精算 " + rest + " 件は、そのまま残ります。"

    okLabel = "精算する";
  } else {
    var e = S.entries.filter(function (x) { return x.id === q.id; })[0];
    if (!e) return "";
    extra = amountBox(yen(Number(e.amount) || 0),
      esc(jpDate(e.date)) + "　" + esc(e.title || "（無題）"));

    if (q.kind === "del") {
      title = "この記録を削除しますか？";
      body = "元に戻せません。";
      note = "同期していれば、相手の端末からも消えます。";
      okLabel = "削除する";
      okVariant = "danger";
    } else if (e.settled) {
      title = "未精算に戻しますか？";
      body = "貸し借りの計算に、もう一度含まれるようになります。";
      okLabel = "未精算に戻す";
    } else {
      title = "この記録を精算済みにしますか？";
      body = "貸し借りの計算から外れます。記録は残ります。";
      okLabel = "精算済みにする";
    }
  }

  return '<div class="backdrop">' +
    '<div class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1">' +
    '<h3 id="dlgTitle">' + esc(title) + '</h3>' +
    '<p>' + esc(body) + '</p>' + extra +
    (note ? '<p style="margin-top:14px">' + esc(note) + '</p>' : '') +
    '<div class="rowacts">' +
    btn("やめる", { variant: "quiet", action: "confirmCancel" }) +
    btn(okLabel, { variant: okVariant, action: "confirmOk" }) +
    '</div></div></div>';
}

function render() {
  var app = document.getElementById("app");
  if (UI.loading) { app.innerHTML = '<p class="muted" style="text-align:center;padding:80px 0">読み込んでいます…</p>'; return; }

  var all = rows();
  var unsettled = all.filter(function (r) { return !r.settled; });
  var net = unsettled.reduce(function (s, r) { return s + r.balance; }, 0);
  var total = unsettled.reduce(function (s, r) { return s + Math.abs(r.balance); }, 0) || 1;
  var pct = 50 + (net > 0 ? 1 : -1) * Math.min(1, Math.abs(net) / total) * 45;
  var owedBy = net > 0 ? S.names.B : S.names.A;
  var owedTo = net > 0 ? S.names.A : S.names.B;

  var h = '<header class="bar"><span class="appname">割り勘</span>' +
    '<span class="status" id="status">' + (UI.saving ? "保存中…" : UI.saveError ? "未保存" : "自動保存") + '</span></header>';

  // 招待リンクの確認。ほかの操作より先に出す
  if (UI.pendingInvite) {
    var host = "";
    try { host = new URL(UI.pendingInvite.url).host; } catch (e) { host = UI.pendingInvite.url; }
    var same = UI.pendingInvite.house === S.sync.house && UI.pendingInvite.url === S.sync.url;
    h += '<main style="padding-top:32px"><div class="card md" style="padding:20px">' +
      '<h2 class="sect" style="font-size:18px">同期の設定を受け取りました</h2>' +
      '<p class="muted" style="margin:0 0 14px">この設定を使うと、いまこの端末にある記録' +
      (S.entries.length ? '（' + S.entries.length + '件）' : '') +
      'が、下の接続先に送られます。</p>' +
      '<div class="kv" style="border-bottom:1px solid var(--border-subtle);padding:10px 0;display:flex;gap:10px">' +
      '<span style="width:80px;font-weight:700;font-size:14px">接続先</span>' +
      '<span class="num" style="flex:1;font-size:13px;word-break:break-all">' + esc(host) + '</span></div>' +
      '<div style="display:flex;gap:10px;padding:10px 0 4px">' +
      '<span style="width:80px;font-weight:700;font-size:14px">共有キー</span>' +
      '<span class="num" style="flex:1;font-size:12px;word-break:break-all;color:var(--text-secondary)">' +
      esc(UI.pendingInvite.house) + '</span></div>' +
      (same
        ? '<div class="note info" style="margin-top:12px;font-size:13px">いま使っている設定と同じです。</div>'
        : '<div class="note warn" style="margin-top:12px;font-size:13px">' +
          '心当たりのないリンクなら、使わないでください。' +
          '見知らぬ接続先を選ぶと、あなたの記録がその相手に渡ります。</div>') +
      '<div class="rowacts" style="margin-top:16px">' +
      btn("やめる", { variant: "quiet", action: "rejectInvite" }) +
      btn("この設定を使う", { action: "applyInvite" }) +
      '</div></div></main>';
    app.innerHTML = h;
    return;
  }

  if (UI.tab === "guide") {
    h += '<main style="padding-top:8px">' + guideHtml() + '</main>' + tabbarHtml();
    app.innerHTML = h;
    window.scrollTo(0, 0);
    return;
  }

  h += '<section class="hero"><div class="gradcard">' +
    '<div class="overline">いまの貸し借り</div>';
  if (net === 0) {
    h += '<div style="margin-top:10px;font-size:28px;font-weight:800;letter-spacing:var(--ls-tight)">貸し借りなし</div>';
  } else {
    h += '<div class="dir"><span style="color:rgba(255,255,255,.85)">' + esc(owedBy) + '</span>' +
      '<span style="display:inline-flex;color:rgba(255,255,255,.7)">' + icon("arrow", 18, 2.4) + '</span>' +
      '<span>' + esc(owedTo) + '</span></div>' +
      '<div style="margin-top:4px">' + money(Math.abs(net), 42) + '</div>';
  }
  h += '<div class="meter"><div class="track"><span class="mid"></span>' +
    '<span class="knob" style="left:calc(' + pct + '% - 8px)"></span></div>' +
    '<div class="ends"><span>' + esc(S.names.B) + ' 払いすぎ</span><span>' + esc(S.names.A) + ' 払いすぎ</span></div>' +
    '</div></div>';

  // 精算するのは、記録の一覧を見ている場面だけです。
  // 追加や設定の画面にも出していたため、
  // 別の操作をしている最中に誤って押せてしまっていました
  if (UI.tab === "home") {
    // 精算する範囲は、下で選んでいる月に合わせます
    var sm = curMonth();
    var tgt = unsettled.filter(function (r) { return inMonth(r, sm); });
    h += '<div style="margin-top:16px">' +
      btn("精算する", { block: true, icon: "check", action: "settle", disabled: !tgt.length }) + '</div>' +
      '<p class="muted" style="margin:10px 2px 0">' +
      (tgt.length
        ? (sm ? ymFull(sm) + "の未精算 " : "未精算 ") + tgt.length + " 件をまとめて精算済みにします。"
        : (sm ? ymFull(sm) + "に未精算の記録はありません。" : "未精算の記録はありません。")) +
      '</p>';
  }
  h += '</section>';

  /* 通知 */
  h += '<div class="notices">';
  if (UI.saveError) {
    h += '<div class="notice err" role="alert"><span class="txt">保存できていません。この内容はまだ残っていません。</span>' +
      btn("もう一度保存", { variant: "danger", size: "sm", action: "retry" }) + '</div>';
  }
  if (UI.notice) {
    h += '<div class="notice info"><span style="display:inline-flex">' + icon("check", 18) + '</span>' +
      '<span class="txt" style="font-size:14px;font-weight:700">' + esc(UI.notice) + '</span>' +
      '<button class="link" data-act="closeNotice">閉じる</button></div>';
  }
  // 控えを促すバナーは出しません。
  // 控えを残す操作は、設定画面からいつでも行えます。
  h += '</div>';

  h += '<main>';
  if (UI.tab === "home") h += homeHtml();
  else if (UI.tab === "add") h += '<div class="stack" style="gap:20px">' + formHtml(UI.form || (UI.form = blankForm())) +
    btn("記録する", { block: true, size: "lg", action: "add" }) + '</div>';
  else if (UI.tab === "paste") h += importHtml();
  else if (UI.tab === "guide") h += guideHtml();
  else h += settingsHtml();
  h += '</main>';

  h += tabbarHtml();
  h += confirmDialogHtml();

  app.innerHTML = h;

  // 確認中は背面を動かさず、操作の焦点をダイアログに移す
  document.body.style.overflow = UI.confirm ? "hidden" : "";
  if (UI.confirm) {
    var dlg = document.getElementById("dlg");
    if (dlg) dlg.focus();
  }
}

function tabbarHtml() {
  return '<nav class="tabbar"><div class="inner">' + [
    { v: "home", l: "記録", i: "list" }, { v: "add", l: "追加", i: "plus" },
    { v: "paste", l: "取込", i: "import" }, { v: "set", l: "設定", i: "gear" },
    { v: "guide", l: "使い方", i: "book" }
  ].map(function (t) {
    return '<button data-tab="' + t.v + '"' + (UI.tab === t.v ? ' class="on"' : '') + '>' +
      '<span class="ico">' + icon(t.i, 22, UI.tab === t.v ? 2.4 : 2) + '</span>' + t.l + '</button>';
  }).join("") + '</div></nav>';
}
function paintStatus() {
  var el = document.getElementById("status");
  if (el) el.textContent = UI.saving ? "保存中…" : UI.saveError ? "未保存" : "自動保存";
}
function repaintPreview() {
  var el = document.getElementById("preview");
  if (el && UI.form) {
    var tmp = document.createElement("div");
    tmp.innerHTML = previewHtml(UI.form);
    el.replaceWith(tmp.firstChild);
  }
}

/* ── 操作 ────────────────────────────────────────────────── */
document.addEventListener("click", function (ev) {
  if (ev.target.closest("#drop")) {
    var picker = document.getElementById("file");
    if (picker) picker.click();
    return;
  }
  var t = ev.target.closest("[data-tab],[data-act],[data-seg],[data-method]");
  if (!t) return;

  if (t.dataset.tab) {
    UI.tab = t.dataset.tab; UI.formError = "";
    if (UI.tab === "add" && !UI.form) UI.form = blankForm();
    if (UI.tab !== "home") { UI.editId = null; }
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (t.dataset.method) { UI.form.method = t.dataset.method; UI.formError = ""; render(); return; }

  if (t.dataset.seg) {
    var v = t.dataset.value, n = t.dataset.seg;
    if (n === "payer") { UI.form.payer = v; render(); }
    else if (n === "filter") { UI.filter = v; render(); }
    else if (n === "scope") { UI.scope = v; render(); }
    else if (n === "importPayer") { UI.importPayer = v; render(); }
    return;
  }

  var id = t.dataset.id;
  switch (t.dataset.act) {
    case "goAdd": UI.tab = "add"; UI.form = blankForm(); render(); break;
    case "goGuide": UI.tab = "guide"; render(); window.scrollTo(0, 0); break;
    case "closeNotice": UI.notice = ""; render(); break;
    case "dismissBanner": UI.bannerOff = S.book.pending; UI.justSettled = false; render(); break;
    case "retry": persist(); render(); break;

    // 伏字の切り替え。
    // 画面全体を描き直すと入力中に指が離れてしまうため、
    // その欄とボタンだけを直接書き換えます
    case "reveal": {
      var fld = t.dataset.id;
      UI.reveal[fld] = !UI.reveal[fld];
      var on = UI.reveal[fld];
      var box = document.querySelector('[data-input="' + fld + '"]');
      if (box) box.type = on ? "text" : "password";
      t.innerHTML = icon(on ? "eyeOff" : "eye", 20);
      t.setAttribute("aria-pressed", on ? "true" : "false");
      t.setAttribute("aria-label", on ? "隠す" : "表示する");
      break;
    }

    // 取り消しにくい操作は、押しただけでは実行しない。
    // 実行はすべて confirmOk に集約する
    case "settle": UI.confirm = { kind: "settleAll", month: curMonth() }; render(); break;
    case "confirmCancel": UI.confirm = null; render(); break;

    case "confirmOk": {
      var q = UI.confirm;
      UI.confirm = null;
      if (!q) { render(); break; }

      if (q.kind === "settleAll") {
        UI.notice = q.month ? ymFull(q.month) + "分を精算しました" : "精算しました";
        UI.justSettled = true; UI.tab = "home";
        change(function () {
          var d = today();
          S.entries = S.entries.map(function (e) {
            if (e.settled || !inMonth(e, q.month)) return e;
            return Object.assign({}, e, { settled: true, settledOn: d, updatedAt: Date.now() });
          });
        });
      } else if (q.kind === "toggle") {
        change(function () {
          S.entries = S.entries.map(function (x) {
            if (x.id !== q.id) return x;
            return Object.assign({}, x, {
              settled: !x.settled, settledOn: x.settled ? "" : today(), updatedAt: Date.now()
            });
          });
        });
      } else if (q.kind === "del") {
        UI.notice = "削除しました";
        change(function () {
          S.trash = (S.trash || []).concat(
            S.entries.filter(function (x) { return x.id === q.id; })
              .map(function (x) { return Object.assign({}, x, { deleted: true, updatedAt: Date.now() }); }));
          S.entries = S.entries.filter(function (x) { return x.id !== q.id; });
        });
      } else {
        render();
      }
      break;
    }

    case "add": {
      var msg = validate(UI.form);
      if (msg) { UI.formError = msg; render(); break; }
      var keep = { date: UI.form.date, payer: UI.form.payer, method: UI.form.method };
      var e = Object.assign({ id: uid() }, fromForm(UI.form),
        { settled: false, settledOn: "", txnId: "", source: "manual", updatedAt: Date.now() });
      change(function () { S.entries = [e].concat(S.entries); });
      UI.form = Object.assign(blankForm(), keep);
      UI.formError = ""; UI.notice = "記録しました"; UI.tab = "home"; render();
      break;
    }

    case "edit": UI.editId = id; UI.formError = "";
      UI.form = toForm(S.entries.filter(function (x) { return x.id === id; })[0]); render(); break;
    case "cancelEdit": UI.editId = null; UI.form = null; UI.formError = ""; render(); break;
    case "saveEdit": {
      var m2 = validate(UI.form);
      if (m2) { UI.formError = m2; render(); break; }
      var next = fromForm(UI.form);
      change(function () {
        S.entries = S.entries.map(function (x) {
          return x.id === id ? Object.assign({}, x, next, { updatedAt: Date.now() }) : x;
        });
      });
      UI.editId = null; UI.form = null; UI.formError = ""; render();
      break;
    }

    // どちらも確認をはさむ。実行は confirmOk 側
    case "toggle": UI.confirm = { kind: "toggle", id: id }; render(); break;
    case "askDel": UI.confirm = { kind: "del", id: id }; render(); break;

    case "togglePaste": UI.showPaste = !UI.showPaste; render(); break;
    case "parse": {
      var res = parsePayPay(UI.csvText);
      UI.parseError = res.error;
      UI.parsed = res.error ? null : res.rows;
      render();
      break;
    }
    case "take": {
      var list = UI.parsed.filter(function (r) { return r.include; }).map(function (r) {
        return { id: uid(), date: r.date, title: r.title, amount: r.amount,
          payer: UI.importPayer, method: "PayPay", aPersonal: 0, bPersonal: 0,
          aPersonalNote: "", bPersonalNote: "", txnId: r.txnId,
          settled: false, settledOn: "", source: "paypay", updatedAt: Date.now() };
      });
      if (!list.length) break;
      change(function () { S.entries = list.concat(S.entries); });
      UI.notice = list.length + " 件を取り込みました";
      UI.parsed = null; UI.csvText = ""; UI.fileName = ""; UI.showPaste = false;
      UI.tab = "home"; render();
      break;
    }

    case "toggleSync":
      S.sync.on = !S.sync.on;
      persistOnly(); render();
      if (S.sync.on && S.sync.url && S.sync.key && S.sync.house) runSync(false);
      break;
    case "applyInvite":
      S.sync = UI.pendingInvite;
      UI.pendingInvite = null;
      UI.notice = "同期の設定を読み込みました";
      persistOnly(); render(); runSync(true);
      break;
    case "rejectInvite":
      UI.pendingInvite = null; render();
      break;
    case "syncNow": runSync(false); break;
    case "copyInvite": copyInvite(); break;
    case "invite": {
      if (location.protocol === "file:") {
        UI.inviteUrl = "";
        UI.syncErr = "招待リンクは、GitHub Pages などに置いた状態でのみ作れます。" +
          "いまはファイルを直接開いているため、相手には設定の3つを手で伝えてください。";
        render();
        break;
      }
      var link = makeInvite();
      UI.inviteUrl = link;
      UI.inviteCopyErr = "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          UI.invited = true; render();
          setTimeout(function () { UI.invited = false; render(); }, 2600);
        }).catch(function () { render(); });
      } else { render(); }
      break;
    }
    case "copy": copyForSheet(); break;
    case "csv": exportCsv(); break;
    case "closeFallback": UI.copyFallback = ""; render(); break;
    case "askReset": UI.confirmReset = true; render(); break;
    case "cancelReset": UI.confirmReset = false; render(); break;
    case "reset":
      change(function () {
        S.trash = (S.trash || []).concat(S.entries.map(function (x) {
          return Object.assign({}, x, { deleted: true, updatedAt: Date.now() });
        }));
        S.entries = [];
      });
      UI.confirmReset = false; UI.notice = "すべての記録を削除しました"; render();
      break;
  }
});

/* 入力は再描画せず、プレビューだけ更新する（入力欄からフォーカスが外れないように） */
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (el.id === "csv") { UI.csvText = el.value; return; }
  if (el.dataset && el.dataset.input) {
    var n = el.dataset.input;
    if (n === "nameA" || n === "nameB") return;
    if (n === "syncUrl" || n === "syncKey" || n === "syncHouse") {
      S.sync[n === "syncUrl" ? "url" : n === "syncKey" ? "key" : "house"] = el.value.trim();
      persistOnly();
      return;
    }
    if (UI.form) { UI.form[n] = el.value; repaintPreview(); }
    return;
  }
  if (el.dataset && el.dataset.flip) {
    var k = el.dataset.flip;
    UI.parsed = UI.parsed.map(function (r) { return r.key === k ? Object.assign({}, r, { include: el.checked }) : r; });
    render();
  }
});

/* ファイルを選んだとき */
document.addEventListener("change", function (ev) {
  if (ev.target && ev.target.dataset && ev.target.dataset.select === "month") {
    UI.month = ev.target.value; render(); return;
  }
  if (ev.target && ev.target.id === "file") {
    readCsvFile(ev.target.files && ev.target.files[0]);
    ev.target.value = "";
  }
});

/* ドラッグ＆ドロップ */
["dragenter", "dragover"].forEach(function (name) {
  document.addEventListener(name, function (ev) {
    var zone = ev.target.closest ? ev.target.closest("#drop") : null;
    if (!zone) return;
    ev.preventDefault();
    zone.classList.add("over");
  });
});
document.addEventListener("dragleave", function (ev) {
  var zone = ev.target.closest ? ev.target.closest("#drop") : null;
  if (zone) zone.classList.remove("over");
});
document.addEventListener("drop", function (ev) {
  var zone = ev.target.closest ? ev.target.closest("#drop") : null;
  if (!zone) return;
  ev.preventDefault();
  zone.classList.remove("over");
  var dt = ev.dataTransfer;
  if (dt && dt.files && dt.files.length) readCsvFile(dt.files[0]);
});
/* 画面の外にドロップして、ブラウザがファイルを開いてしまうのを防ぐ */
document.addEventListener("dragover", function (ev) { ev.preventDefault(); });
document.addEventListener("drop", function (ev) {
  if (!(ev.target.closest && ev.target.closest("#drop"))) ev.preventDefault();
});

/* 表示名は入力を終えた時点で反映する */
document.addEventListener("blur", function (ev) {
  var el = ev.target;
  if (!el.dataset || !el.dataset.input) return;
  if (el.dataset.input === "nameA" || el.dataset.input === "nameB") {
    var side = el.dataset.input === "nameA" ? "A" : "B";
    var v = el.value.trim() || (side === "A" ? "Aさん" : "Bさん");
    if (S.names[side] === v) return;
    S.names[side] = v;
    S.namesUpdatedAt = Date.now();
    persist();
    render();
  }
}, true);

/* ── 起動 ────────────────────────────────────────────────── */
Store.load().then(function (d) {
  if (d) {
    if (d.names) S.names = Object.assign(S.names, d.names);
    if (Array.isArray(d.entries)) S.entries = d.entries.map(stampEntry);
    if (d.book) S.book = Object.assign(S.book, d.book);
    if (d.sync) S.sync = Object.assign(S.sync, d.sync);
    if (d.namesUpdatedAt) S.namesUpdatedAt = d.namesUpdatedAt;
    if (Array.isArray(d.trash)) S.trash = d.trash;
  }
  // 招待リンクがあれば取り込む。
  // ただし、すでに記録や別の接続先がある場合は必ず確認する。
  // 細工したリンクを踏ませて、手元の記録を他人のサーバーへ
  // 送らせる手口があるためです。
  var invite = readInvite();
  if (invite) {
    var fresh = S.entries.length === 0 && !S.sync.url;
    if (fresh) {
      S.sync = invite;
      UI.notice = "同期の設定を読み込みました";
      persistOnly();
    } else {
      UI.pendingInvite = invite;
    }
  } else if (!S.sync.url && DEFAULTS.url && DEFAULTS.key && DEFAULTS.house) {
    // ファイルに埋め込まれた値（配布用に書き換えた場合）
    S.sync = { url: DEFAULTS.url, key: DEFAULTS.key, house: DEFAULTS.house, on: true };
  }
  clearInvite();

  UI.loading = false;
  render();
  if (syncReady()) runSync(true);
});

/* 画面に戻ってきたときに、相手の変更を取り込む */
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && syncReady()) runSync(true);
});

/* Escキーでも確認をやめられるようにする。
   キー操作は誤って触れる心配がないので、背面タップとは別に扱います */
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Escape") return;
  if (UI.confirm) { UI.confirm = null; render(); }
  else if (UI.editId) { UI.editId = null; UI.form = null; UI.formError = ""; render(); }
});
</script>
</body>
