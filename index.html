    btn(UI.syncing ? "同期しています…" : "いま同期する",
        { block: true, variant: "secondary", action: "syncNow", icon: "sync",
          disabled: UI.syncing || !(S.sync.url && S.sync.key && S.sync.house) }) +
    // 送っても何も届かないリンクは作らせません。
    // 一度でも同期できていれば、相手は同じ記録にたどり着けます
    (S.sync.url && S.sync.key && S.sync.house && !S.sync.lastOk
      ? '<div class="note warn" style="font-size:13px">この端末はまだ一度も同期できていません。' +
        'いまリンクを送っても、相手の画面には何も出ません。' +
        'まず「いま同期する」で記録を送ってください。</div>'
      : '') +
    btn(UI.inviteUrl ? "リンクを作り直す" : "相手を招待するリンクを作る",
        { block: true, variant: "quiet", action: "invite", icon: "copy",
          disabled: !(S.sync.url && S.sync.key && S.sync.house && S.sync.lastOk) }) +
    (UI.inviteUrl
      ? '<textarea class="ta" id="invitebox" readonly ' +
        'style="height:80px;font-size:12px;background:var(--surface-sunken)">' +
        esc(UI.inviteUrl) + '</textarea>' +
        btn(UI.invited ? "コピーしました" : "リンクを全部コピー",
            { block: true, action: "copyInvite", icon: UI.invited ? "check" : "copy" }) +
        (UI.inviteCopyErr
          ? '<p class="muted" style="margin:-4px 2px 0">' + esc(UI.inviteCopyErr) + '</p>'
          : '') +
        '<div class="note warn" style="font-size:13px">このリンクには鍵が入っています。' +
        '相手だけに届く方法で送り、SNSなど人目に触れる場所には貼らないでください。</div>'
      : '') +
    (UI.syncErr
      ? '<div class="note warn" style="font-size:13px">' + esc(UI.syncErr) + '</div>'
      : '<div class="muted">' + (UI.lastSync
          ? esc(UI.lastSync + " に同期しました。")
          : S.sync.lastOk
            ? esc(whenLabel(new Date(S.sync.lastOk).toISOString()) + " に同期しました。")
          : S.sync.on ? "まだ一度も同期できていません。" : "同期は止まっています。") + '</div>') +
    '</div></section>';

  h += fixedHtml();

  h += '<section><h2 class="sect">重複の確認</h2><div class="card" style="display:grid;gap:12px">' +
    '<p class="muted" style="margin:0">金額と日付が近い記録を並べて、二重に記録していないかを確かめられます。</p>' +
    btn("似た記録を探す", { block: true, variant: "secondary", action: "goDups", icon: "list" }) +
    '</div></section>';

  h += '<section><h2 class="sect">控えを残す</h2><div class="card" style="display:grid;gap:12px">' +
    '<p class="muted" style="margin:0">スプレッドシートに貼っておけば、このアプリのデータが消えても復旧できます。精算のタイミングで残す習慣がおすすめです。</p>' +
    btn(UI.copied ? "コピーしました" : "シートに貼る形でコピー",
        { block: true, action: "copy", icon: UI.copied ? "check" : "copy", disabled: !all.length }) +
    '<p class="muted" style="margin:-4px 2px 0">スプレッドシートを開いてA1を選び、貼り付けるだけです。</p>' +
    btn("CSVをダウンロード（" + all.length + "件）",
        { block: true, variant: "secondary", action: "csv", icon: "download", disabled: !all.length }) +
    '<div class="muted" style="padding-top:4px">' +
    (S.book.lastExportAt
      ? esc("最後に控えを残したのは " + whenLabel(S.book.lastExportAt) +
        (S.book.pending > 0 ? " ・ そのあと " + S.book.pending + " 回の変更があります" : " ・ そのあとの変更はありません"))
      : "まだ控えを残していません。") +
    '</div></div>';

  if (UI.copyFallback) {
    h += '<div class="card" style="margin-top:12px;display:grid;gap:10px">' +
      '<div style="font-size:14px;font-weight:700">手動でコピーしてください</div>' +
      '<p class="muted" style="margin:0">この環境では自動コピーが使えませんでした。下の枠内を全選択してコピーしてください。</p>' +
      '<textarea class="ta" id="fallback" readonly style="height:140px;background:var(--surface-sunken)">' + esc(UI.copyFallback) + '</textarea>' +
      btn("閉じる", { variant: "quiet", size: "sm", action: "closeFallback" }) + '</div>';
  }
  h += '</section>';

  h += '<section><h2 class="sect">誰が何で立て替えたか</h2>' +
    seg("scope", ["未精算", "すべて"], UI.scope) + '<div style="height:12px"></div>' +
    '<div class="card" style="padding:14px 16px"><table class="xtab">' +
    '<colgroup><col><col class="who"><col class="who"></colgroup>' +
    '<thead><tr><th></th><th>' + esc(S.names.A) + '</th><th>' + esc(S.names.B) + '</th></tr></thead><tbody>';
  METHODS.forEach(function (m) {
    h += '<tr><th scope="row"><span class="mth">' + catIcon(m, true) + esc(m) + '</span></th>' +
      ["A", "B"].map(function (p) {
        var v = sum[p + m] || 0;
        return '<td' + (v ? '' : ' class="zero"') + '>' + yen(v) + '</td>';
      }).join("") + '</tr>';
  });
  h += '</tbody><tfoot><tr><th scope="row">合計</th>' +
    ["A", "B"].map(function (p) {
      return '<td>' + yen(METHODS.reduce(function (t, m) { return t + (sum[p + m] || 0); }, 0)) + '</td>';
    }).join("") + '</tr></tfoot></table></div>' +
    '<p class="muted" style="margin:10px 2px 0">' +
    (UI.scope === "未精算" ? "まだ精算していない分の立替額です。" : "精算済みも含めた累計です。") +
    '</p></section>';

  h += '<section>';
  if (UI.confirmReset) {
    h += '<div class="card" style="background:var(--danger-50)">' +
      '<p style="margin:0 0 12px;font-size:14px;font-weight:600;color:var(--danger-ink)">すべての記録を削除します。元に戻せません。</p>' +
      '<div style="display:flex;gap:8px">' +
      btn("削除する", { variant: "danger", size: "sm", action: "reset" }) +
      btn("やめる", { variant: "quiet", size: "sm", action: "cancelReset" }) + '</div></div>';
  } else {
    h += '<button type="button" class="btn btn-ghost sm" data-act="askReset" style="color:var(--danger-500)">すべての記録を削除</button>';
  }
  h += '</section>';

  h += '<p class="muted" style="text-align:center">保存先：' +
    (Store.mode === "local" ? "このブラウザ（他の端末とは共有されません）"
      : Store.mode === "artifact" ? "Claudeの保存領域"
      : "メモリのみ。閉じると消えるため、控えを残してください") + '</p>';

  return h + '</div>';
}

/* 取り消しにくい操作の最終確認。
   背面には data-act を置いていないので、押しても閉じません。
   「やめる」か実行かを選ぶまで先へ進みません。 */
function amountBox(main, sub) {
  return '<span class="amount"><span class="n num">' + main + '</span>' +
    '<span class="u">' + sub + '</span></span>';
}

function confirmDialogHtml() {
  var q = UI.confirm;
  if (!q) return "";

  var title, body, note = "", extra = "", okLabel, okVariant = "primary";

  if (q.kind === "delFixed") {
    var ft = S.fixed.filter(function (x) { return x.id === q.id; })[0];
    if (!ft) return "";
    title = "この固定費の登録をやめますか？";
    body = "次からは自動で記録されなくなります。";
    extra = amountBox(yen(Number(ft.amount) || 0), "毎月" + ft.day + "日　" + esc(ft.title));
    note = "これまでに記録された分は、一覧に残ります。";
    okLabel = "登録をやめる";
    okVariant = "danger";
  } else if (q.kind === "settleAll") {
    var open = rows().filter(function (r) { return !r.settled; });
    var un = open.filter(function (r) { return inScope(r, q.month, q.payer); });
    var rest = open.length - un.length;
    var lbl = scopeLabel(q.month, q.payer);
    var net = un.reduce(function (s, r) { return s + r.balance; }, 0);
    title = lbl ? lbl + "分を精算しますか？" : "精算しますか？";
    body = (lbl ? lbl + "の未精算" : "未精算の") + un.length + "件を、まとめて精算済みにします。";
    extra = net !== 0
      ? amountBox(yen(Math.abs(net)),
          esc(net > 0 ? S.names.B : S.names.A) + " → " + esc(net > 0 ? S.names.A : S.names.B))
      : amountBox("貸し借りなし", "やりとりは発生しません");
    // 対象外が残るときは、はっきり伝えます。
    // 上の「いまの貸し借り」は全期間・ふたりぶんの合計なので、
    // 金額が食い違って見えて不安になるためです
    note = rest
      ? "絞り込みの外にある未精算 " + rest + " 件は、そのまま残ります。"
      : "記録が消えることはありません。「すべて」に切り替えれば、あとから見返せます。";
    okLabel = "精算する";
  } else {
    var e = S.entries.filter(function (x) { return x.id === q.id; })[0];
    if (!e) return "";
    extra = amountBox(yen(Number(e.amount) || 0),
      esc(jpDate(e.date)) + "　" + esc(e.title || "（無題）"));

    if (q.kind === "del") {
      title = "この記録を削除しますか？";
      body = "元に戻せません。";
      note = "同期していれば、相手の端末からも消えます。";
      okLabel = "削除する";
      okVariant = "danger";
    } else if (e.settled) {
      title = "未精算に戻しますか？";
      body = "貸し借りの計算に、もう一度含まれるようになります。";
      okLabel = "未精算に戻す";
    } else {
      title = "この記録を精算済みにしますか？";
      body = "貸し借りの計算から外れます。記録は残ります。";
      okLabel = "精算済みにする";
    }
  }

  return '<div class="backdrop">' +
    '<div class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1">' +
    '<h3 id="dlgTitle">' + esc(title) + '</h3>' +
    '<p>' + esc(body) + '</p>' + extra +
    (note ? '<p style="margin-top:14px">' + esc(note) + '</p>' : '') +
    '<div class="rowacts">' +
    btn("やめる", { variant: "quiet", action: "confirmCancel" }) +
    btn(okLabel, { variant: okVariant, action: "confirmOk" }) +
    '</div></div></div>';
}

function render() {
  var app = document.getElementById("app");
  if (UI.loading) { app.innerHTML = '<p class="muted" style="text-align:center;padding:80px 0">読み込んでいます…</p>'; return; }

  var all = rows();
  var unsettled = all.filter(function (r) { return !r.settled; });
  var net = unsettled.reduce(function (s, r) { return s + r.balance; }, 0);
  var total = unsettled.reduce(function (s, r) { return s + Math.abs(r.balance); }, 0) || 1;
  var pct = 50 + (net > 0 ? 1 : -1) * Math.min(1, Math.abs(net) / total) * 45;
  var owedBy = net > 0 ? S.names.B : S.names.A;
  var owedTo = net > 0 ? S.names.A : S.names.B;

  var h = '<header class="bar"><span class="appname">割り勘</span>' +
    '<span class="status" id="status">' + (UI.saving ? "保存中…" : UI.saveError ? "未保存" : "自動保存") + '</span></header>';

  // 招待リンクの確認。ほかの操作より先に出す
  if (UI.pendingInvite) {
    var host = "";
    try { host = new URL(UI.pendingInvite.url).host; } catch (e) { host = UI.pendingInvite.url; }
    var same = UI.pendingInvite.house === S.sync.house && UI.pendingInvite.url === S.sync.url;
    h += '<main style="padding-top:32px"><div class="card md" style="padding:20px">' +
      '<h2 class="sect" style="font-size:18px">同期の設定を受け取りました</h2>' +
      '<p class="muted" style="margin:0 0 14px">この設定を使うと、いまこの端末にある記録' +
      (S.entries.length ? '（' + S.entries.length + '件）' : '') +
      'が、下の接続先に送られます。</p>' +
      '<div class="kv" style="border-bottom:1px solid var(--border-subtle);padding:10px 0;display:flex;gap:10px">' +
      '<span style="width:80px;font-weight:700;font-size:14px">接続先</span>' +
      '<span class="num" style="flex:1;font-size:13px;word-break:break-all">' + esc(host) + '</span></div>' +
      '<div style="display:flex;gap:10px;padding:10px 0 4px">' +
      '<span style="width:80px;font-weight:700;font-size:14px">共有キー</span>' +
      '<span class="num" style="flex:1;font-size:12px;word-break:break-all;color:var(--text-secondary)">' +
      esc(UI.pendingInvite.house) + '</span></div>' +
      (same
        ? '<div class="note info" style="margin-top:12px;font-size:13px">いま使っている設定と同じです。</div>'
        : '<div class="note warn" style="margin-top:12px;font-size:13px">' +
          '心当たりのないリンクなら、使わないでください。' +
          '見知らぬ接続先を選ぶと、あなたの記録がその相手に渡ります。</div>') +
      '<div class="rowacts" style="margin-top:16px">' +
      btn("やめる", { variant: "quiet", action: "rejectInvite" }) +
      btn("この設定を使う", { action: "applyInvite" }) +
      '</div></div></main>';
    app.innerHTML = h;
    return;
  }

  if (UI.tab === "guide") {
    h += '<main style="padding-top:8px">' + guideHtml() + '</main>' + tabbarHtml();
    app.innerHTML = h;
    window.scrollTo(0, 0);
    return;
  }

  h += '<section class="hero"><div class="gradcard">' +
    '<div class="overline">いまの貸し借り</div>';
  if (net === 0) {
    h += '<div style="margin-top:10px;font-size:28px;font-weight:800;letter-spacing:var(--ls-tight)">貸し借りなし</div>';
  } else {
    h += '<div class="dir"><span style="color:rgba(255,255,255,.85)">' + esc(owedBy) + '</span>' +
      '<span style="display:inline-flex;color:rgba(255,255,255,.7)">' + icon("arrow", 18, 2.4) + '</span>' +
      '<span>' + esc(owedTo) + '</span></div>' +
      '<div style="margin-top:4px">' + money(Math.abs(net), 42) + '</div>';
  }
  h += '<div class="meter"><div class="track"><span class="mid"></span>' +
    '<span class="knob" style="left:calc(' + pct + '% - 8px)"></span></div>' +
    '<div class="ends"><span>' + esc(S.names.B) + ' 払いすぎ</span><span>' + esc(S.names.A) + ' 払いすぎ</span></div>' +
    '</div></div>';

  // 精算するのは、記録の一覧を見ている場面だけです。
  // 追加や設定の画面にも出していたため、
  // 別の操作をしている最中に誤って押せてしまっていました
  if (UI.tab === "home") {
    // 精算する範囲は、下で選んでいる絞り込みに合わせます。
    // 一覧に出ているものがそのまま対象、という一つの決まりにします
    var sm = curMonth(), sp = curPayer(), slbl = scopeLabel(sm, sp);
    var tgt = unsettled.filter(function (r) { return inScope(r, sm, sp); });
    h += '<div style="margin-top:16px">' +
      btn("精算する", { block: true, icon: "check", action: "settle", disabled: !tgt.length }) + '</div>' +
      '<p class="muted" style="margin:10px 2px 0">' +
      (tgt.length
        ? esc(slbl ? slbl + "の未精算 " : "未精算 ") + tgt.length + " 件をまとめて精算済みにします。"
        : esc(slbl ? slbl + "に未精算の記録はありません。" : "未精算の記録はありません。")) +
      '</p>';
  }
  h += '</section>';

  /* 通知 */
  h += '<div class="notices">';
  if (UI.saveError) {
    h += '<div class="notice err" role="alert"><span class="txt">保存できていません。この内容はまだ残っていません。</span>' +
      btn("もう一度保存", { variant: "danger", size: "sm", action: "retry" }) + '</div>';
  }
  // 同期の失敗は設定画面の中だけに出していました。
  // 相手の記録が出てこない理由がここにあるため、どの画面でも知らせます
  if (UI.syncErr && UI.tab !== "set") {
    h += '<div class="notice err" role="alert"><span class="txt">' + esc(UI.syncErr) + '</span>' +
      btn("設定を見る", { variant: "danger", size: "sm", action: "goSync" }) + '</div>';
  }
  if (UI.rcSending) {
    h += '<div class="notice info"><span class="txt">レシートの写真を送っています…</span></div>';
  }
  if (UI.rcErr) {
    h += '<div class="notice err" role="alert"><span class="txt">' + esc(UI.rcErr) + '</span>' +
      '<button class="link" data-act="closeRcErr">閉じる</button></div>';
  }
  if (UI.notice) {
    h += '<div class="notice info"><span style="display:inline-flex">' + icon("check", 18) + '</span>' +
      '<span class="txt" style="font-size:14px;font-weight:700">' + esc(UI.notice) + '</span>' +
      '<button class="link" data-act="closeNotice">閉じる</button></div>';
  }
  // 控えを促すバナーは出しません。
  // 控えを残す操作は、設定画面からいつでも行えます。
  h += '</div>';

  h += '<main>';
  if (UI.tab === "home") h += homeHtml();
  else if (UI.tab === "add") h += '<div class="stack" style="gap:20px">' + formHtml(UI.form || (UI.form = blankForm()), true) +
    btn("記録する", { block: true, size: "lg", action: "add" }) + '</div>';
  else if (UI.tab === "paste") h += importHtml();
  else if (UI.tab === "dups") h += dupsHtml();
  else if (UI.tab === "guide") h += guideHtml();
  else h += settingsHtml();
  h += '</main>';

  h += tabbarHtml();
  h += confirmDialogHtml();
  if (!UI.confirm) h += receiptViewerHtml();

  app.innerHTML = h;

  // 確認中は背面を動かさず、操作の焦点をダイアログに移す
  document.body.style.overflow = UI.confirm || UI.viewRc ? "hidden" : "";
  if (UI.confirm || UI.viewRc) {
    var dlg = document.getElementById(UI.confirm ? "dlg" : "rcdlg");
    if (dlg && document.activeElement !== dlg) dlg.focus();
  }
}

function tabbarHtml() {
  return '<nav class="tabbar"><div class="inner">' + [
    { v: "home", l: "記録", i: "list" }, { v: "add", l: "追加", i: "plus" },
    { v: "paste", l: "取込", i: "import" }, { v: "set", l: "設定", i: "gear" },
    { v: "guide", l: "使い方", i: "book" }
  ].map(function (t) {
    return '<button data-tab="' + t.v + '"' + (UI.tab === t.v ? ' class="on"' : '') + '>' +
      '<span class="ico">' + icon(t.i, 22, UI.tab === t.v ? 2.4 : 2) + '</span>' + t.l + '</button>';
  }).join("") + '</div></nav>';
}
function paintStatus() {
  var el = document.getElementById("status");
  if (el) el.textContent = UI.saving ? "保存中…" : UI.saveError ? "未保存" : "自動保存";
}
function activeForm() {
  return UI.tab === "set" && UI.fixedEdit ? UI.fform : UI.form;
}
function repaintPreview() {
  var el = document.getElementById("preview");
  var f = activeForm();
  if (el && f) {
    var tmp = document.createElement("div");
    tmp.innerHTML = previewHtml(f);
    el.replaceWith(tmp.firstChild);
  }
}

/* ── 操作 ────────────────────────────────────────────────── */
document.addEventListener("click", function (ev) {
  if (ev.target.closest("#drop")) {
    var picker = document.getElementById("file");
    if (picker) picker.click();
    return;
  }
  var t = ev.target.closest("[data-tab],[data-act],[data-seg],[data-method]");
  if (!t) return;

  if (t.dataset.tab) {
    UI.tab = t.dataset.tab; UI.formError = ""; UI.payerOpen = false;
    UI.fixedEdit = null; UI.fform = null;
    // 編集中の中身を持ったまま「追加」を開くと、その記録の内容が入ってしまうため捨てます
    if (UI.tab !== "home" && UI.editId) { UI.editId = null; UI.form = null; }
    if (UI.tab === "add" && !UI.form) UI.form = blankForm();
    if (UI.tab === "paste" && S.me && !UI.parsed) UI.importPayer = S.me;
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (t.dataset.method) { activeForm().method = t.dataset.method; UI.formError = ""; render(); return; }

  if (t.dataset.seg) {
    var v = t.dataset.value, n = t.dataset.seg;
    if (n === "payer") {
      activeForm().payer = v;
      // 追加のときに選んだ人は、この端末で覚えておきます
      if (UI.tab === "add") { S.me = v; UI.payerOpen = false; persistOnly(); }
      render();
    }
    else if (n === "filter") { UI.filter = v; render(); }
    else if (n === "scope") { UI.scope = v; render(); }
    else if (n === "importPayer") { UI.importPayer = v; render(); }
    return;
  }

  var id = t.dataset.id;
  switch (t.dataset.act) {
    case "goAdd": UI.tab = "add"; UI.form = blankForm(); render(); break;
    case "goGuide": UI.tab = "guide"; render(); window.scrollTo(0, 0); break;
    case "goDups":
      if (UI.editId) { UI.editId = null; UI.form = null; }
      UI.tab = "dups"; render(); window.scrollTo(0, 0); break;
    case "goHome": UI.tab = "home"; render(); window.scrollTo(0, 0); break;
    case "openPayer": UI.payerOpen = true; render(); break;

    case "rcPick": {
      var picker2 = document.getElementById(id);
      if (picker2) picker2.click();
      break;
    }
    case "rcClear": {
      var rf = activeForm();
      if (rf.rcData) rf.rcData = ""; else rf.rcRemove = true;
      render(); break;
    }
    case "viewRc": UI.viewRc = id; render(); fetchReceipt(id); break;
    case "closeRc": UI.viewRc = null; render(); break;
    case "openRc": openReceipt(id); break;
    case "closeRcErr": UI.rcErr = ""; render(); break;

    case "newFixed":
      UI.fixedEdit = "new"; UI.formError = "";
      UI.fform = Object.assign(blankForm(), { fixed: true, day: "", startYm: ymOf(today()), started: false });
      render(); break;
    case "editFixed": {
      var ft = S.fixed.filter(function (x) { return x.id === id; })[0];
      if (!ft) break;
      UI.fixedEdit = id; UI.formError = "";
      UI.fform = Object.assign(toForm(Object.assign({ date: "" }, ft)),
        { fixed: true, day: String(ft.day), startYm: ft.startYm, lastYm: ft.lastYm || "", started: !!ft.lastYm });
      render(); break;
    }
    case "cancelFixed": UI.fixedEdit = null; UI.fform = null; UI.formError = ""; render(); break;
    case "saveFixed": {
      var fe = validate(UI.fform) || fixedError(UI.fform);
      if (fe) { UI.formError = fe; render(); break; }
      var tpl = fixedFromForm(UI.fform);
      if (UI.fixedEdit === "new") {
        S.fixed = S.fixed.concat([Object.assign({ id: uid() }, tpl)]);
      } else {
        // 直した内容は、これから記録する分から使います
        var fid = UI.fixedEdit;
        S.fixed = S.fixed.map(function (x) {
          return x.id === fid ? Object.assign({}, x, tpl, { id: fid, lastYm: x.lastYm || "" }) : x;
        });
      }
      UI.fixedEdit = null; UI.fform = null; UI.formError = "";
      UI.notice = "固定費を保存しました";
      persistOnly();
      runFixed();
      render(); break;
    }
    case "askDelFixed": UI.confirm = { kind: "delFixed", id: id }; render(); break;
    case "notDup":
      if (S.notDup.indexOf(id) < 0) S.notDup = S.notDup.concat([id]);
      UI.notice = "この組は、今後は出しません";
      persistOnly(); render();
      break;
    case "closeNotice": UI.notice = ""; render(); break;
    case "dismissBanner": UI.bannerOff = S.book.pending; UI.justSettled = false; render(); break;
    case "retry": persist(); render(); break;

    // 伏字の切り替え。
    // 画面全体を描き直すと入力中に指が離れてしまうため、
    // その欄とボタンだけを直接書き換えます
    case "reveal": {
      var fld = t.dataset.id;
      UI.reveal[fld] = !UI.reveal[fld];
      var on = UI.reveal[fld];
      var box = document.querySelector('[data-input="' + fld + '"]');
      if (box) box.type = on ? "text" : "password";
      t.innerHTML = icon(on ? "eyeOff" : "eye", 20);
      t.setAttribute("aria-pressed", on ? "true" : "false");
      t.setAttribute("aria-label", on ? "隠す" : "表示する");
      break;
    }

    // 取り消しにくい操作は、押しただけでは実行しない。
    // 実行はすべて confirmOk に集約する
    case "settle":
      UI.confirm = { kind: "settleAll", month: curMonth(), payer: curPayer() };
      render(); break;
    case "confirmCancel": UI.confirm = null; render(); break;

    case "confirmOk": {
      var q = UI.confirm;
      UI.confirm = null;
      if (!q) { render(); break; }

      if (q.kind === "settleAll") {
        var okLbl = scopeLabel(q.month, q.payer);
        UI.notice = okLbl ? okLbl + "分を精算しました" : "精算しました";
        UI.justSettled = true; UI.tab = "home";
        change(function () {
          var d = today();
          S.entries = S.entries.map(function (e) {
            if (e.settled || !inScope(e, q.month, q.payer)) return e;
            return Object.assign({}, e, { settled: true, settledOn: d, updatedAt: Date.now() });
          });
        });
      } else if (q.kind === "toggle") {
        change(function () {
          S.entries = S.entries.map(function (x) {
            if (x.id !== q.id) return x;
            return Object.assign({}, x, {
              settled: !x.settled, settledOn: x.settled ? "" : today(), updatedAt: Date.now()
            });
          });
        });
      } else if (q.kind === "delFixed") {
        S.fixed = S.fixed.filter(function (x) { return x.id !== q.id; });
        UI.notice = "固定費の登録をやめました";
        persistOnly(); render();
      } else if (q.kind === "del") {
        UI.notice = "削除しました";
        if (S.receipts[q.id]) removeReceipt(q.id);
        change(function () {
          S.trash = (S.trash || []).concat(
            S.entries.filter(function (x) { return x.id === q.id; })
              .map(function (x) { return Object.assign({}, x, { deleted: true, updatedAt: Date.now() }); }));
          S.entries = S.entries.filter(function (x) { return x.id !== q.id; });
        });
      } else {
        render();
      }
      break;
    }

    case "add": {
      var msg = validate(UI.form);
      if (msg) { UI.formError = msg; render(); break; }
      var keep = { date: UI.form.date, payer: UI.form.payer, method: UI.form.method };
      var e = Object.assign({ id: uid() }, fromForm(UI.form),
        { settled: false, settledOn: "", txnId: "", source: "manual", updatedAt: Date.now() });
      var newRc = UI.form.rcData;
      S.me = e.payer;
      change(function () { S.entries = [e].concat(S.entries); });
      UI.form = Object.assign(blankForm(), keep);
      // 誰の立て替えにしたかを言葉でも返し、選び違いに気づけるようにします
      UI.formError = ""; UI.notice = S.names[e.payer] + "の立て替えとして記録しました"; UI.tab = "home"; render();
      if (newRc) uploadReceipt(e.id, newRc);
      break;
    }

    case "edit": UI.editId = id; UI.formError = "";
      UI.form = toForm(S.entries.filter(function (x) { return x.id === id; })[0]); render();
      if (S.receipts[id]) fetchReceipt(id);
      break;
    case "cancelEdit": UI.editId = null; UI.form = null; UI.formError = ""; render(); break;
    case "saveEdit": {
      var m2 = validate(UI.form);
      if (m2) { UI.formError = m2; render(); break; }
      var next = fromForm(UI.form);
      var editRc = UI.form.rcData, dropRc = UI.form.rcRemove;
      change(function () {
        S.entries = S.entries.map(function (x) {
          return x.id === id ? Object.assign({}, x, next, { updatedAt: Date.now() }) : x;
        });
      });
      UI.editId = null; UI.form = null; UI.formError = ""; render();
      if (editRc) uploadReceipt(id, editRc);
      else if (dropRc) removeReceipt(id);
      break;
    }

    // どちらも確認をはさむ。実行は confirmOk 側
    case "toggle": UI.confirm = { kind: "toggle", id: id }; render(); break;
    case "askDel": UI.confirm = { kind: "del", id: id }; render(); break;

    case "togglePaste": UI.showPaste = !UI.showPaste; render(); break;
    case "parse": {
      var res = parsePayPay(UI.csvText);
      UI.parseError = res.error;
      UI.parsed = res.error ? null : res.rows;
      render();
      break;
    }
    case "take": {
      var list = UI.parsed.filter(function (r) { return r.include; }).map(function (r) {
        return { id: uid(), date: r.date, title: r.title, amount: r.amount,
          payer: UI.importPayer, method: "PayPay", aPersonal: 0, bPersonal: 0,
          aPersonalNote: "", bPersonalNote: "", txnId: r.txnId,
          settled: false, settledOn: "", source: "paypay", updatedAt: Date.now() };
      });
      if (!list.length) break;
      change(function () { S.entries = list.concat(S.entries); });
      UI.notice = list.length + " 件を取り込みました";
      UI.parsed = null; UI.csvText = ""; UI.fileName = ""; UI.showPaste = false;
      UI.tab = "home"; render();
      break;
    }

    case "toggleSync":
      S.sync.on = !S.sync.on;
      persistOnly(); render();
      if (S.sync.on && S.sync.url && S.sync.key && S.sync.house) runSync(false);
      break;
    case "applyInvite":
      S.sync = UI.pendingInvite;
      UI.pendingInvite = null;
      UI.notice = "同期の設定を読み込みました";
      persistOnly(); render(); runSync(true);
      break;
    case "rejectInvite":
      UI.pendingInvite = null; render();
      break;
    case "goSync": UI.tab = "set"; render(); window.scrollTo(0, 0); break;
    case "syncNow": runSync(false); break;
    case "copyInvite": copyInvite(); break;
    case "invite": {
      if (location.protocol === "file:") {
        UI.inviteUrl = "";
        UI.syncErr = "招待リンクは、GitHub Pages などに置いた状態でのみ作れます。" +
          "いまはファイルを直接開いているため、相手には設定の3つを手で伝えてください。";
        render();
        break;
      }
      var link = makeInvite();
      UI.inviteUrl = link;
      UI.inviteCopyErr = "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          UI.invited = true; render();
          setTimeout(function () { UI.invited = false; render(); }, 2600);
        }).catch(function () { render(); });
      } else { render(); }
      break;
    }
    case "copy": copyForSheet(); break;
    case "csv": exportCsv(); break;
    case "closeFallback": UI.copyFallback = ""; render(); break;
    case "askReset": UI.confirmReset = true; render(); break;
    case "cancelReset": UI.confirmReset = false; render(); break;
    case "reset":
      change(function () {
        S.trash = (S.trash || []).concat(S.entries.map(function (x) {
          return Object.assign({}, x, { deleted: true, updatedAt: Date.now() });
        }));
        S.entries = [];
      });
      UI.confirmReset = false; UI.notice = "すべての記録を削除しました"; render();
      break;
  }
});

/* 入力は再描画せず、プレビューだけ更新する（入力欄からフォーカスが外れないように） */
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (el.id === "csv") { UI.csvText = el.value; return; }
  if (el.dataset && el.dataset.input) {
    var n = el.dataset.input;
    if (n === "nameA" || n === "nameB") return;
    if (n === "syncUrl" || n === "syncKey" || n === "syncHouse") {
      S.sync[n === "syncUrl" ? "url" : n === "syncKey" ? "key" : "house"] = el.value.trim();
      persistOnly();
      return;
    }
    var af = activeForm();
    if (af) { af[n] = el.value; repaintPreview(); }
    return;
  }
  if (el.dataset && el.dataset.flip) {
    var k = el.dataset.flip;
    UI.parsed = UI.parsed.map(function (r) { return r.key === k ? Object.assign({}, r, { include: el.checked }) : r; });
    render();
  }
});

/* ファイルを選んだとき */
document.addEventListener("change", function (ev) {
  var sel = ev.target && ev.target.dataset && ev.target.dataset.select;
  if (sel === "month") { UI.month = ev.target.value; render(); return; }
  if (sel === "payer") { UI.payer = ev.target.value; render(); return; }
  if (ev.target && ev.target.dataset && ev.target.dataset.receipt) {
    var pic = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!pic) return;
    UI.rcReading = true; UI.formError = ""; render();
    shrinkImage(pic).then(function (data) {
      var f = activeForm();
      if (f) { f.rcData = data; f.rcRemove = false; }
      UI.rcReading = false; render();
    }).catch(function (err) {
      UI.rcReading = false; UI.formError = err.message; render();
    });
    return;
  }
  if (ev.target && ev.target.id === "file") {
    readCsvFile(ev.target.files && ev.target.files[0]);
    ev.target.value = "";
  }
});

/* ドラッグ＆ドロップ */
["dragenter", "dragover"].forEach(function (name) {
  document.addEventListener(name, function (ev) {
    var zone = ev.target.closest ? ev.target.closest("#drop") : null;
    if (!zone) return;
    ev.preventDefault();
    zone.classList.add("over");
  });
});
document.addEventListener("dragleave", function (ev) {
  var zone = ev.target.closest ? ev.target.closest("#drop") : null;
  if (zone) zone.classList.remove("over");
});
document.addEventListener("drop", function (ev) {
  var zone = ev.target.closest ? ev.target.closest("#drop") : null;
  if (!zone) return;
  ev.preventDefault();
  zone.classList.remove("over");
  var dt = ev.dataTransfer;
  if (dt && dt.files && dt.files.length) readCsvFile(dt.files[0]);
});
/* 画面の外にドロップして、ブラウザがファイルを開いてしまうのを防ぐ */
document.addEventListener("dragover", function (ev) { ev.preventDefault(); });
document.addEventListener("drop", function (ev) {
  if (!(ev.target.closest && ev.target.closest("#drop"))) ev.preventDefault();
});

/* 表示名は入力を終えた時点で反映する */
document.addEventListener("blur", function (ev) {
  var el = ev.target;
  if (!el.dataset || !el.dataset.input) return;
  if (el.dataset.input === "nameA" || el.dataset.input === "nameB") {
    var side = el.dataset.input === "nameA" ? "A" : "B";
    var v = el.value.trim() || (side === "A" ? "Aさん" : "Bさん");
    if (S.names[side] === v) return;
    S.names[side] = v;
    S.namesUpdatedAt = Date.now();
    persist();
    render();
  }
}, true);

/* ── 起動 ────────────────────────────────────────────────── */
Store.load().then(function (d) {
  if (d) {
    if (d.names) S.names = Object.assign(S.names, d.names);
    if (Array.isArray(d.entries)) S.entries = d.entries.map(stampEntry);
    if (d.book) S.book = Object.assign(S.book, d.book);
    if (d.sync) S.sync = Object.assign(S.sync, d.sync);
    if (d.namesUpdatedAt) S.namesUpdatedAt = d.namesUpdatedAt;
    if (Array.isArray(d.trash)) S.trash = d.trash;
    if (d.me === "A" || d.me === "B") S.me = d.me;
    if (Array.isArray(d.notDup)) S.notDup = d.notDup;
    if (Array.isArray(d.fixed)) S.fixed = d.fixed;
    if (d.receipts && typeof d.receipts === "object") S.receipts = d.receipts;
  }
  UI.importPayer = S.me || "A";
  // 招待リンクがあれば取り込む。
  // ただし、すでに記録や別の接続先がある場合は必ず確認する。
  // 細工したリンクを踏ませて、手元の記録を他人のサーバーへ
  // 送らせる手口があるためです。
  var invite = readInvite();
  if (invite) {
    var fresh = S.entries.length === 0 && !S.sync.url;
    if (fresh) {
      S.sync = invite;
      UI.notice = "同期の設定を読み込みました";
      persistOnly();
    } else {
      UI.pendingInvite = invite;
    }
  } else if (inviteBroken()) {
    UI.notice = "リンクが途中で切れているようです。もう一度、リンク全体を送ってもらってください。";
  } else if (!S.sync.url && DEFAULTS.url && DEFAULTS.key && DEFAULTS.house) {
    // ファイルに埋め込まれた値（配布用に書き換えた場合）
    S.sync = { url: DEFAULTS.url, key: DEFAULTS.key, house: DEFAULTS.house, on: true };
  }
  clearInvite();

  UI.loading = false;
  render();
  runFixed();
  if (syncReady()) runSync(true);
});

/* 画面に戻ってきたときに、相手の変更を取り込む */
document.addEventListener("visibilitychange", function () {
  if (document.hidden) return;
  // 開いたまま日をまたいだときも、固定費の日が来ていれば記録します
  runFixed();
  if (syncReady()) runSync(true);
});

/* Escキーでも確認をやめられるようにする。
   キー操作は誤って触れる心配がないので、背面タップとは別に扱います */
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Escape") return;
  if (UI.confirm) { UI.confirm = null; render(); }
  else if (UI.viewRc) { UI.viewRc = null; render(); }
  else if (UI.editId) { UI.editId = null; UI.form = null; UI.formError = ""; render(); }
});
</script>
